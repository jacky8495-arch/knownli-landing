<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,450&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; overflow:hidden; }
  .card {
    width:1200px; height:630px;
    background:#f0e6d0;
    position:relative;
    font-family:'Noto Sans TC',sans-serif;
    padding:70px 80px;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  /* 右側呼應教學的「紅框標注」motif，淡淡疊在背景 */
  .motif {
    position:absolute; right:-60px; top:120px;
    width:520px; height:360px;
    border:3px solid rgba(212,72,38,.16);
    border-radius:18px;
  }
  .motif::before {
    content:''; position:absolute; inset:34px;
    border:2px solid rgba(26,18,8,.06); border-radius:12px;
  }
  .glow {
    position:absolute; right:-120px; bottom:-120px;
    width:520px; height:520px; border-radius:50%;
    background:radial-gradient(circle, rgba(212,72,38,.10), transparent 65%);
  }

  /* ── 品牌列 ── */
  .brand { position:relative; z-index:2; }
  .tick { width:54px; height:4px; background:#d44826; border-radius:2px; margin-bottom:22px; }
  .logo {
    font-family:'Fraunces',Georgia,serif;
    font-size:52px; line-height:1; letter-spacing:-.01em;
  }
  .logo .known { font-weight:300; color:#1a1208; }
  .logo .li    { font-weight:450; font-style:italic; color:#d44826; }
  .brand-sub {
    margin-top:12px; padding-bottom:26px;
    font-size:24px; font-weight:500; color:#6b5c48; letter-spacing:.02em;
    border-bottom:1.5px solid #d9c9ad;
    display:inline-block;
  }

  /* ── 主標 ── */
  .headline {
    position:relative; z-index:2;
    margin-top:auto;
    font-family:'Noto Serif TC',serif;
    font-size:90px; font-weight:600; line-height:1.12;
    color:#1a1208; letter-spacing:.01em;
  }
  .headline .accent {
    font-family:'Fraunces',Georgia,serif;
    font-style:italic; font-weight:600; color:#d44826;
  }
  .subline {
    position:relative; z-index:2;
    margin-top:24px;
    font-size:30px; font-weight:500; color:#4a3728; letter-spacing:.01em;
  }

  /* ── 底部 pills + 網址 ── */
  .footer {
    position:relative; z-index:2;
    margin-top:38px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .pills { display:flex; gap:14px; }
  .pill {
    border:1.5px solid #c9b48f; border-radius:100px;
    padding:9px 20px; font-size:21px; font-weight:500; color:#6b5c48;
    background:rgba(255,255,255,.35);
  }
  .url { font-size:23px; font-weight:500; color:#9a8868; letter-spacing:.02em; }
</style>
</head>
<body>
<div class="card">
  <div class="motif"></div>
  <div class="glow"></div>

  <div class="brand">
    <div class="tick"></div>
    <div class="logo"><span class="known">Known</span><span class="li">li</span></div>
    <div class="brand-sub">店家專用訂位系統</div>
  </div>

  <div class="headline">官方 LINE <span class="accent">設定教學</span></div>
  <div class="subline">跟著做，10 分鐘把官方帳號接上訂位系統 — 免技術背景</div>

  <div class="footer">
    <div class="pills">
      <div class="pill">兩種方式任選</div>
      <div class="pill">圖解步驟</div>
      <div class="pill">10 分鐘完成</div>
    </div>
    <div class="url">www.knownli.com</div>
  </div>
</div>
</body>
</html>
